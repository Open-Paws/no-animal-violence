# Speciesist language patterns for retext-equality / alex
# Category: speciesism
#
# These patterns detect language that normalizes violence toward animals
# or frames animals as objects/tools. Alternatives are clearer, more
# professional, and don't perpetuate speciesist bias.
#
# Academic sources:
# - Hagendorff, Bossert, Tse & Singer (2023), "Speciesist bias in AI", AI and Ethics
# - Takeshita, Rzepka & Araki (2022), Information Processing & Management
# - Leach et al. (2023), British Journal of Social Psychology

# === Violent Animal Idioms ===

- type: basic
  note: >-
    This phrase normalizes violence toward birds. The alternative is equally
    expressive and more professional.
  source: https://doi.org/10.1007/s43681-023-00380-w
  considerate:
    accomplish two things at once: a
    solve two problems at once: a
  inconsiderate:
    kill two birds with one stone: speciesism

- type: basic
  note: >-
    This phrase trivializes violence toward horses. The alternatives convey
    the same meaning without referencing animal harm.
  considerate:
    belabor the point: a
    go over old ground: a
  inconsiderate:
    beat a dead horse: speciesism
    beating a dead horse: speciesism

- type: basic
  note: >-
    This phrase references animal slaughter. The alternatives convey the same
    meaning without referencing animal products.
  considerate:
    bring home the results: a
    earn a living: a
  inconsiderate:
    bring home the bacon: speciesism

- type: basic
  note: >-
    This phrase references animal experimentation. The alternatives are more
    precise and don't normalize using animals as test subjects.
  condition: when used as a metaphor
  considerate:
    test subject: a
    beta tester: a
    first to try: a
  inconsiderate:
    guinea pig: speciesism

- type: basic
  note: >-
    This phrase depicts graphic violence toward cats. The alternatives are
    clearer and more professional.
  considerate:
    more than one way to solve this: a
    many ways to approach this: a
  inconsiderate:
    more than one way to skin a cat: speciesism

- type: basic
  note: >-
    This phrase references selling animals under false pretenses. The
    alternatives are clearer in professional contexts.
  considerate:
    reveal the secret: a
    disclose the information: a
  inconsiderate:
    let the cat out of the bag: speciesism

- type: basic
  note: >-
    This phrase references using live animals as fishing bait. The alternatives
    convey the same meaning more precisely.
  considerate:
    create a complicated situation: a
    raise a difficult issue: a
  inconsiderate:
    open a can of worms: speciesism

- type: basic
  note: >-
    This phrase references chasing wild geese for sport. The alternatives are
    more precise.
  considerate:
    futile search: a
    pointless pursuit: a
    fools errand: a
  inconsiderate:
    wild goose chase: speciesism

- type: basic
  note: >-
    This phrase depicts violence toward horses. The alternatives convey the
    same meaning without referencing animal harm.
  considerate:
    belabor the point: a
    waste effort on a lost cause: a
  inconsiderate:
    flog a dead horse: speciesism
    flogging a dead horse: speciesism

- type: basic
  note: >-
    This phrase references bullfighting. The alternatives convey the same
    assertiveness without referencing animal exploitation.
  considerate:
    face the challenge head on: a
    tackle the problem directly: a
  inconsiderate:
    take the bull by the horns: speciesism

- type: basic
  note: >-
    This phrase depicts gratuitous violence toward fish. The alternatives
    convey the same meaning without referencing animal harm.
  considerate:
    extremely easy: a
    effortless: a
  inconsiderate:
    like shooting fish in a barrel: speciesism

- type: basic
  note: >-
    This phrase is both speciesist and culturally insensitive, trivializing
    Hindu religious practices while objectifying cattle.
  considerate:
    untouchable topic: a
    unquestioned belief: a
    protected idea: a
  inconsiderate:
    sacred cow: speciesism
    sacred cows: speciesism

- type: basic
  note: >-
    This term originates from the ritual sacrifice of goats. The alternatives
    convey the same meaning without referencing animal harm.
  considerate:
    fall guy: a
    wrongly blamed: a
  inconsiderate:
    scapegoat: speciesism
    scapegoated: speciesism
    scapegoating: speciesism

- type: basic
  note: >-
    This phrase references examining horses' teeth for commercial sale.
    The alternatives are more precise in professional contexts.
  considerate:
    from a reliable source: a
    directly from the source: a
  inconsiderate:
    straight from the horses mouth: speciesism
    from the horses mouth: speciesism

- type: basic
  note: >-
    This phrase references a game based on hitting animals. The alternatives
    more precisely describe the pattern being referenced.
  considerate:
    recurring problem: a
    unwinnable game: a
  inconsiderate:
    whack a mole: speciesism

# === Infrastructure / Technical Metaphors ===

- type: basic
  note: >-
    The cattle/pets metaphor normalizes treating sentient beings as disposable
    commodities. 'Ephemeral' and 'persistent' more precisely describe the
    infrastructure concept.
  source: https://doi.org/10.1007/s43681-023-00380-w
  considerate:
    ephemeral vs persistent: a
    fungible vs unique: a
  inconsiderate:
    cattle vs pets: speciesism
    cattle versus pets: speciesism
    cattle not pets: speciesism

- type: basic
  note: >-
    This term references using canaries in coal mines as expendable early
    warning systems. The alternatives more precisely describe modern deployment
    practices.
  condition: when referring to deployment strategy
  considerate:
    progressive rollout: a
    incremental deployment: a
    staged release: a
  inconsiderate:
    canary deployment: speciesism
    canary release: speciesism

- type: basic
  note: >-
    This term references using canaries in coal mines. 'Sentinel value' and
    'guard value' are already used in related security contexts.
  condition: when referring to security mechanisms
  considerate:
    sentinel value: a
    guard value: a
    stack sentinel: a
  inconsiderate:
    stack canary: speciesism
    canary value: speciesism

- type: basic
  note: >-
    'Runtime patch' and 'dynamic patch' more precisely describe the technique.
  considerate:
    runtime patch: a
    dynamic patch: a
    hot patch: a
  inconsiderate:
    monkey patch: speciesism
    monkey patching: speciesism

- type: basic
  note: >-
    'Structural typing' is the formal computer science term for this concept.
  considerate:
    structural typing: a
    implicit typing: a
  inconsiderate:
    duck typing: speciesism

- type: basic
  note: >-
    'Self-hosting' and 'self-testing' more precisely describe the practice.
  considerate:
    self hosting: a
    self testing: a
    using your own product: a
  inconsiderate:
    dogfooding: speciesism
    eating your own dogfood: speciesism
    eat your own dogfood: speciesism

- type: basic
  note: >-
    This phrase uses a predator-prey relationship as the archetype of deception.
    Alternatives describe the concept directly without animal framing.
  considerate:
    deceptive actor: a
    bad actor in disguise: a
    hidden threat: a
  inconsiderate:
    wolf in sheep's clothing: speciesism
    wolves in sheep's clothing: speciesism

- type: basic
  note: >-
    This phrase references trading horses as commodities. Alternatives describe
    the negotiation pattern without the animal framing.
  considerate:
    political bargaining: a
    transactional negotiation: a
    trading favors: a
  inconsiderate:
    horse trading: speciesism
    horse-trading: speciesism

- type: basic
  note: >-
    This phrase uses a snake as a metaphor for treachery. Alternatives describe
    the threat directly.
  considerate:
    hidden threat: a
    concealed adversary: a
    lurking danger: a
  inconsiderate:
    snake in the grass: speciesism

- type: basic
  note: >-
    This phrase uses a weasel as a metaphor for evasiveness. Alternatives
    describe the language problem precisely.
  considerate:
    deliberately vague language: a
    evasive language: a
    non-committal phrasing: a
  inconsiderate:
    weasel words: speciesism
    weasel word: speciesism

- type: basic
  note: >-
    This phrase references a predator killing farmed birds to describe conflicted
    oversight. Alternatives describe the structural conflict directly.
  considerate:
    conflicted oversight: a
    self-interested regulator: a
  inconsiderate:
    fox guarding the henhouse: speciesism
    fox in the henhouse: speciesism

- type: basic
  note: >-
    This phrase references slaughtered and chilled poultry to describe abrupt
    cessation. Alternatives describe the action directly.
  considerate:
    abrupt cessation: a
    stop immediately: a
    quit all at once: a
  inconsiderate:
    cold turkey: speciesism
    go cold turkey: speciesism

- type: basic
  note: >-
    This phrase references stealing a goat. Alternatives describe the irritation
    directly.
  considerate:
    annoy you: a
    irritate you: a
    get under your skin: a
  inconsiderate:
    get your goat: speciesism
    get my goat: speciesism
    got my goat: speciesism

- type: basic
  note: >-
    This phrase references farmed cattle returning from pasture. Alternatives
    communicate the indefinite timeframe directly.
  considerate:
    indefinitely: a
    for a very long time: a
    without end: a
  inconsiderate:
    until the cows come home: speciesism

- type: basic
  note: >-
    This phrase references farm animals in an implausibility idiom. Alternatives
    describe the deception without the animal framing.
  considerate:
    fabricated story: a
    implausible claim: a
    tall tale: a
  inconsiderate:
    cock-and-bull story: speciesism
    cock and bull story: speciesism

- type: basic
  note: >-
    Variant of 'throw someone to the wolves' — also covers the form without
    an explicit pronoun.
  considerate:
    abandon to criticism: a
    leave to face hostility alone: a
  inconsiderate:
    throw to the wolves: speciesism
    thrown to the wolves: speciesism

- type: basic
  note: >-
    Standalone variant of 'there are bigger fish to fry' — catches the shortened
    form used in technical writing.
  considerate:
    more important matters to address: a
    higher priorities: a
  inconsiderate:
    bigger fish to fry: speciesism

# === Industry Euphemisms ===

- type: basic
  note: >-
    Applies agricultural crop-harvest framing to killing animals. 'Harvesting'
    obscures that living beings are being killed.
  considerate:
    catching fish: a
    fishing: a
    taking animals: a
  inconsiderate:
    harvesting animals: industry-euphemism
    harvest animals: industry-euphemism
    fish harvest: industry-euphemism
    harvesting fish: industry-euphemism

- type: basic
  note: >-
    Welfare-washing: 'free-range' implies humane conditions but still involves
    confinement and slaughter. Use only when quoting certification standards
    directly; otherwise describe actual conditions.
  considerate:
    eggs from hens with outdoor access: a
    chicken with outdoor access: a
  inconsiderate:
    free-range eggs: industry-euphemism
    free range eggs: industry-euphemism
    free-range chicken: industry-euphemism
    free range chicken: industry-euphemism

- type: basic
  note: >-
    Welfare-washing: 'cage-free' implies humane conditions but hens may still
    be confined at high density indoors. Use only when quoting certification
    standards directly; otherwise describe actual conditions.
  considerate:
    eggs from uncaged hens: a
    hens without cages: a
  inconsiderate:
    cage-free eggs: industry-euphemism
    cage free eggs: industry-euphemism
    cage-free hens: industry-euphemism
    cage free hens: industry-euphemism
