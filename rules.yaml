# Canonical phrase list for the no-animal-violence suite.
# Edit this file. Run tools/generate_all.py to regenerate all downstream formats.
# DO NOT edit downstream tool files directly — they are generated.
version: "1.0.0"
rules:
  - name: kill-two-birds-with-one-stone
    terms:
      - kill two birds with one stone
      - killing two birds with one stone
      - killed two birds with one stone
    alternatives:
      - accomplish two things at once
      - solve two problems with one action
      - hit two targets with one shot
    severity: error
    category: animal-violence
    reason: "This phrase frames killing animals as a routine way to solve a problem. Plain alternatives like 'accomplish two things at once' carry the same meaning without invoking harm."
    word_boundary: false
    regex: "kill\\s+two\\s+birds\\s+with\\s+one\\s+stone"
    context_suppressions: []

  - name: beat-a-dead-horse
    terms:
      - beat a dead horse
      - beating a dead horse
    alternatives:
      - belabor the point
      - go over old ground
      - repeat unnecessarily
    severity: error
    category: animal-violence
    reason: "This phrase uses an image of striking an animal's body as a metaphor for wasted effort. 'Belabor the point' is clearer and skips the imagery."
    word_boundary: false
    regex: "beat(ing)?\\s+a\\s+dead\\s+horse"
    context_suppressions: []

  - name: skin-a-cat
    terms:
      - more than one way to skin a cat
      - another way to skin a cat
      - different ways to skin a cat
      - several ways to skin a cat
    alternatives:
      - more than one way to peel an orange
      - multiple approaches available
      - several ways to do this
    severity: error
    category: animal-violence
    reason: "Cat skinning as a metaphor for having options. 'Multiple approaches available' or 'more than one way to peel an orange' carries the same meaning."
    word_boundary: false
    regex: "(more\\s+than\\s+one|another|different|several)\\s+way[s]?\\s+to\\s+skin\\s+a\\s+cat"
    context_suppressions: []

  - name: let-the-cat-out-of-the-bag
    terms:
      - let the cat out of the bag
      - letting the cat out of the bag
    alternatives:
      - reveal the secret
      - disclose prematurely
      - let it slip
    severity: info
    category: animal-violence
    reason: "Traced to fraudulent livestock markets and implies trapping animals. 'Reveal the secret' says the same thing more directly."
    word_boundary: false
    regex: "let\\s+the\\s+cat\\s+out\\s+of\\s+the\\s+bag"
    context_suppressions: []

  - name: open-a-can-of-worms
    terms:
      - open a can of worms
      - opening a can of worms
      - opened a can of worms
    alternatives:
      - create a complicated situation
      - uncover hidden problems
      - open Pandora's box
    severity: info
    category: animal-violence
    reason: "References worms packaged as live bait to catch and kill fish. 'Open a difficult topic' or 'uncover hidden problems' is more precise."
    word_boundary: false
    regex: "open(ing)?\\s+a\\s+can\\s+of\\s+worms"
    context_suppressions: []

  - name: wild-goose-chase
    terms:
      - wild goose chase
    alternatives:
      - futile search
      - pointless pursuit
      - fool's errand
    severity: info
    category: animal-violence
    reason: "Casts pursuing a living bird as a pointless annoyance. 'Futile search' or 'fool's errand' says the same thing without the hunting framing."
    word_boundary: false
    regex: "wild\\s+goose\\s+chase"
    context_suppressions: []

  - name: shooting-fish-in-a-barrel
    terms:
