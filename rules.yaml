# Canonical phrase list for the no-animal-violence suite.
# Edit this file. Run tools/generate_all.py to regenerate all downstream formats.
# DO NOT edit downstream tool files directly — they are generated.
version: "1.0.0"
rules:
  - name: kill-two-birds-with-one-stone
    terms:
      - kill two birds with one stone
      - killing two birds with one stone
      - killed two birds with one stone
    alternatives:
      - accomplish two things at once
      - solve two problems with one action
      - hit two targets with one shot
    severity: error
    category: animal-violence
    reason: "This phrase frames killing animals as a routine way to solve a problem. Plain alternatives like 'accomplish two things at once' carry the same meaning without invoking harm."
    word_boundary: false
    regex: "kill\\s+two\\s+birds\\s+with\\s+one\\s+stone"
    context_suppressions: []

  - name: beat-a-dead-horse
    terms:
      - beat a dead horse
      - beating a dead horse
    alternatives:
      - belabor the point
      - go over old ground
      - repeat unnecessarily
    severity: error
    category: animal-violence
    reason: "This phrase uses an image of striking an animal's body as a metaphor for wasted effort. 'Belabor the point' is clearer and skips the imagery."
    word_boundary: false
    regex: "beat(ing)?\\s+a\\s+dead\\s+horse"
    context_suppressions: []

  - name: more-than-one-way-to-skin-a-cat
