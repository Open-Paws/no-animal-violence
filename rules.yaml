      - several ways to accomplish this
    severity: error
    category: animal-violence
    reason: "Treats a graphic act of violence against cats as an everyday problem-solving metaphor. 'More than one way to solve this' works just as well."
    word_boundary: false
    regex: "(?:more\\s+than\\s+one|many|other)\\s+ways?\\s+to\\s+skin\\s+a\\s+cat"
    context_suppressions: []

