      - no challenge at all
    severity: error
    category: animal-violence
    reason: "Mass-killing imagery used to mean 'easy.' 'Trivially easy' or 'a sure thing' says the same thing without it."
    word_boundary: false
    regex: "(like\\s+)?shoot(ing)?\\s+fish\\s+in\\s+a\\s+barrel"
    context_suppressions: []

