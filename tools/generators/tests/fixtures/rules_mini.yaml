version: "1.0.0"
rules:
  - name: guinea-pig
    terms:
      - guinea pig
    alternatives:
      - test subject
      - first to try
    severity: warning
    category: animal-violence
    reason: "Refers to using guinea pigs as expendable test subjects. 'Test subject' is more precise."
    word_boundary: true
    regex: "guinea\\s+pig"
    context_suppressions: []

  - name: livestock
    terms:
      - livestock
    alternatives:
      - farmed animals
      - animals raised for food
    severity: warning
    category: industry-euphemism
    reason: "Industry term that defines sentient beings by their commercial function. 'Farmed animals' is factually equivalent."
    word_boundary: true
    regex: "livestock"
    context_suppressions: []

  - name: curiosity-killed-the-cat
    terms:
      - curiosity killed the cat
    alternatives:
      - curiosity backfired
    severity: error
    category: animal-violence
    reason: "A direct reference to killing a cat. 'Curiosity backfired' says the same thing."
    word_boundary: false
    regex: "curiosity\\s+killed\\s+the\\s+cat"
    context_suppressions: []
